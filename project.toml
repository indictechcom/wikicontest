# Toolforge Build Service configuration
[build-system]
requires = ["heroku/nodejs", "heroku/python", "heroku/procfile"]

[[build.buildpacks]]
uri = "heroku/nodejs"

[[build.buildpacks]]
uri = "heroku/python"

[[build.buildpacks]]
uri = "heroku/procfile"

# Explicitly enable npm install to include devDependencies (vite is required for build)
[build.env]
name = "USE_NPM_INSTALL"
value = "true"

# Explicitly run build and postinstall scripts during build
[build.env]
name = "NPM_RUN_SCRIPTS"
value = "build,postinstall"
